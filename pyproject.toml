[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matejgome-cacheinval"
version = "0.1.0"
description = "沿失效记录标出触发原因、传播路径与实际影响范围"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "matejgome" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://matejgome.github.io"
Repository = "https://github.com/matejgome/cacheinval"
Issues = "https://github.com/matejgome/cacheinval/issues"

[project.scripts]
cacheinval = "cacheinval:main"

[tool.setuptools]
py-modules = ["cacheinval"]
